services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wellos
      POSTGRES_PASSWORD: wellos_dev
      POSTGRES_DB: wellos
    ports:
      - "5432:5432"
    volumes:
      - wellos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wellos-pgdata:
