[workspace]
resolver = "2"
members = [
    "crates/wellos-domain",
    "crates/dmind-gateway",
    "crates/wellos-server",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
async-trait = "0.1"
rust_decimal = { version = "1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
