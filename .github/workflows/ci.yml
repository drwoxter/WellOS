name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust fmt, clippy, unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wellos
          POSTGRES_PASSWORD: wellos_dev
          POSTGRES_DB: wellos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wellos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wellos:wellos_dev@localhost:5432/wellos
      # CI is an explicit test environment: synthetic fixtures only, no
      # external AI provider is ever configured or called here.
      WELLOS_ENV: test
      WELLOS_ALLOW_SYNTHETIC_SEED: "true"
      DMIND_MODEL_PROVIDER: fake
      WELLOS_SCRIBE_PROVIDER: fake
      WELLOS_OBJECT_STORE: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (production feature set)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (dev-fixtures)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Production build has no fixtures compiled in
        run: cargo build -p wellos-server --bins
      - name: Unit tests
        run: cargo test --workspace --lib
      - name: Migrations from empty database
        run: cargo run -p wellos-server --bin migrate
      - name: Seed synthetic data (dev-fixtures, test environment)
        run: cargo run -p wellos-server --bin seed --features dev-fixtures
      - name: Pre-0015 upgrade migration gate (0001..0014 schema + legacy visits -> 0015)
        run: cargo test -p wellos-server --test upgrade_migration_integration
      - name: Integration tests
        run: cargo test --workspace --test '*'

  web:
    name: Web lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Component tests
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E (staff + patient journeys, ES, a11y, 390 px)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wellos
          POSTGRES_PASSWORD: wellos_dev
          POSTGRES_DB: wellos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wellos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wellos:wellos_dev@localhost:5432/wellos
      # Explicit synthetic test environment: dev-fixtures build, fake AI and
      # scribe providers, development sign-in. No external provider is
      # configured, so no network call leaves the runner.
      WELLOS_ENV: test
      WELLOS_ALLOW_SYNTHETIC_SEED: "true"
      WELLOS_DEV_AUTH: "true"
      DMIND_MODEL_PROVIDER: fake
      WELLOS_SCRIBE_PROVIDER: fake
      WELLOS_OBJECT_STORE: fixture
      WELLOS_BIND_ADDR: 127.0.0.1:8080
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Build API server (dev-fixtures, test environment)
        run: cargo build -p wellos-server --features dev-fixtures
      - name: Migrations from empty database
        run: cargo run -p wellos-server --bin migrate
      - name: Seed synthetic fixtures
        run: cargo run -p wellos-server --bin seed --features dev-fixtures
      - name: Playwright (desktop + mobile-390 projects)
        working-directory: apps/web
        run: npm run test:e2e
      - name: Upload Playwright report and traces (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Dependency audits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Rust dependency audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Web production dependency audit (must be clean)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Web complete dependency audit (single documented exception, see docs/security/dependency-risk-acceptances.md)
        working-directory: apps/web
        run: node scripts/check-npm-audit.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
